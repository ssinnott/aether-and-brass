# Build the single-file game and publish it to GitHub Pages.
#
# Pages is enabled on this repository with Source = GitHub Actions, so a push to main
# redeploys https://ssinnott.github.io/aether-and-brass/
#
# Every push and pull request builds, but only main deploys: the github-pages environment restricts
# deployments to the default branch, and a deploy from anywhere else is rejected with
# 'Branch "..." is not allowed to deploy to github-pages due to environment protection rules'.
# To publish from another branch, add it under
# Settings -> Environments -> github-pages -> Deployment branches, then run this workflow by
# hand from the Actions tab on that branch.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Pull requests build only (the deploy job is gated below), so a PR proves the site still
  # builds before it can reach main.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Allow the workflow to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every gate that needs no browser: typecheck (engine/, net/, content/, art/ against their
      # JSDoc — emits nothing, src/ ships as the same plain ES modules either way), the sim suite,
      # the lockstep/protocol tests, and both halves of the art-invariant gate. Fast, and it runs
      # before the build so nothing red reaches a deploy. Two of these gates had drifted red while
      # CI ran neither of them, which is the reason this step exists as one command.
      - name: Gates (typecheck, sim, net, art)
        run: npm run check

      # The browser tier is separate because it is the only thing here that needs Chromium, and a
      # ~6-minute playthrough should not be what stands between a docs typo and a deploy.
      - name: Install Chromium for the playtest harness
        run: npx playwright install --with-deps chromium

      - name: Headless playthrough
        run: npm run check:browser

      - name: Build the single-file game
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # main deploys automatically; a manual run can deploy any branch the github-pages
  # environment permits. Other branches build only, so a push does not fail on the
  # environment's branch rule.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rig contact sheet</title>
<style>
  html, body { margin: 0; background: #1c1822; color: #eee; font: 12px monospace; }
  canvas { display: block; image-rendering: pixelated; }
  /* In normal flow BELOW the canvas, never over it: sheet-capture.js screenshots the #sheet element itself,
     and a fixed-position overlay lands inside that screenshot — every captured sheet used to carry this text
     burned into its top-right corner. The sheet is the evidence; nothing may paint on top of it. */
  #help { padding: 8px; color: #9a8f7a; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sheet" width="64" height="64"></canvas>
<div id="help">?char=brunhild | ?enemy=typeA:grunt
&mode=anims|strip|attacks|closeup|cast  &zoom=3
&anims=walk,run  &step=3  &cols=9  &samples=8
&bg=docks|#hex  &cw=100  &ch=124</div>
<script type="module" src="./sheet.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Aether &amp; Brass">
<meta name="theme-color" content="#000000">
<title>Aether &amp; Brass</title>
<!-- Home-screen app: manifest, icons and worker are all generated by tools/pwa.js (served from
     memory by the dev server, written beside dist/index.html by the build). Every one of them is
     optional — with none of them present this is the same single page it has always been. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  // In the head, so the body-only build (dist/artifact.html takes the title, the stylesheets and
  // the body) never carries it into somebody else's page. Nothing in this file's head may spell a
  // style or body tag inside a comment either: tools/build.js finds them by regex.
  (function () {
    // The playtest harness drives a fresh page every run: a worker would only add a race to it.
    if (location.search.indexOf('autotest') !== -1) return;
    // Embedded in a host page (dist/artifact.html): the app scope is not ours to claim.
    if (window.top !== window) return;
    if ('serviceWorker' in navigator) {
      // After load: the worker is for the NEXT launch, and the page comes first.
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Ask for the worker script by hand rather than trusting the browser's own update check,
          // which is best-effort and throttled — an installed copy can sit on an old build for days.
          // It is two kilobytes; a build that has moved on then installs now and opens next launch.
          return reg.update();
        }).catch(function () { /* file://, offline, or not deployed */ });
      });
    }
    // An installed copy is held to the manifest's landscape on Android; where the lock is refused
    // (iOS has none) the portrait notice below stays the fallback.
    var mm = window.matchMedia;
    var installed = (mm && (mm('(display-mode: fullscreen)').matches || mm('(display-mode: standalone)').matches)) || navigator.standalone;
    if (installed && screen.orientation && screen.orientation.lock) {
      try {
        var lock = screen.orientation.lock('landscape');
        if (lock && lock.catch) lock.catch(function () { /* refused: the notice covers it */ });
      } catch (e) { /* unsupported */ }
    }
  })();
</script>
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden;
               overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none;
                /* The game handles its own pointers: no panning, pinch-zoom, tap highlight or text selection. */
                touch-action: none; -webkit-tap-highlight-color: transparent;
                -webkit-user-select: none; user-select: none; }
  /* Phones held upright get a very short game; suggest turning the device. */
  #rotate { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center;
            background: #0b0710; color: #e2b34a; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace;
            text-align: center; letter-spacing: 1px; padding: 24px; box-sizing: border-box; }
  @media (hover: none) and (orientation: portrait) { #rotate { display: flex; } }
  #errors { position: fixed; left: 0; top: 0; max-width: 100%; margin: 0; padding: 6px 8px; box-sizing: border-box;
            background: rgba(120, 0, 0, .9); color: #fff; font: 12px/1.4 monospace; white-space: pre-wrap; z-index: 10; display: none; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360" tabindex="0"></canvas>
<div id="rotate">TURN YOUR DEVICE SIDEWAYS<br>TO PLAY AETHER &amp; BRASS</div>
<pre id="errors"></pre>
<script>
  // Installed BEFORE the module graph loads so that import/parse failures are captured too.
  // src/main.js extends this object with the full debug API (ARCHITECTURE.md section 12/15).
  (function () {
    var hooks = window.__game = { ready: false, errors: [] };
    var box = document.getElementById('errors');
    function record(msg) {
      hooks.errors.push(String(msg));
      if (box) { box.style.display = 'block'; box.textContent = hooks.errors.slice(-8).join('\n'); }
    }
    window.addEventListener('error', function (e) {
      var m = e.message || (e.error && e.error.message) || 'unknown error';
      if (e.filename) m += ' (' + e.filename.replace(/^.*\//, '') + ':' + e.lineno + ')';
      record(m);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; record('unhandled rejection: ' + (r && r.message ? r.message : r));
    });
    hooks._record = record;
  })();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
